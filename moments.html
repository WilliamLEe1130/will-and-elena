<body>

<div class="page-hero">

  <a class="back" href="index.html">← 返回主页</a>

<div class="page-body">
  <div class="moments-grid" id="momentsGrid"></div>
</div>

<footer>
  做这个网站的人：<span class="heart">Will</span> · 写给Elena
</footer>

<script src="data.js"></script>
<script>
(function(){
  var mg = document.getElementById('momentsGrid');
  moments.forEach(function(m){
    var c = document.createElement('div');
    c.className = 'moment-card fade';
    c.innerHTML = '<div class="md">'+m.date+'</div><h3>'+m.title+'</h3><p>'+m.note+'</p>';
    mg.appendChild(c);
  });
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    },{threshold:.12});
    document.querySelectorAll('.fade').forEach(function(el){ io.observe(el); });
  }
})();
</script>
</body>
