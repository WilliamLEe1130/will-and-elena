<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的照片 · Will & Elena</title>
<link rel="stylesheet" href="style.css">
<script src="gate.js"></script>
<!--
  ══════════════════════════════════════════
  照片独立页(显示全部照片)
  · 照片分两组:ELENA(她的) / WILL & ELENA(合照)
  · 照片路径在 data.js 的 photosElena / photosBoth 数组里改
  · 照片文件放 photos/elena/ 和 photos/both/ 文件夹
  ══════════════════════════════════════════
-->
</head>
<body>

<header>
  <nav>
    <a class="brand" href="index.html">Will&nbsp;·&nbsp;Elena</a>
    <div class="links">
      <a href="reflection.html">反思</a>
      <a href="moments.html">时刻</a>
      <a href="gallery.html" class="active">照片</a>
      <a href="likes.html">她喜欢的</a>
    </div>
  </nav>
</header>

<div class="cats left">
  <img src="cats/cat1.jpg" alt="小猫">
  <img src="cats/cat2.jpg" alt="小猫">
  <img src="cats/cat5.jpg" alt="小猫">
</div>
<div class="cats right">
  <img src="cats/cat3.jpg" alt="小猫">
  <img src="cats/cat4.jpg" alt="小猫">
  <img src="cats/cat6.jpg" alt="小猫">
</div>

<div class="page-hero">
  <div class="no">03 / GALLERY</div>
  <h1>我们的照片</h1>
  <p>慢慢填满。</p>
  <a class="back" href="index.html">← 返回主页</a>
</div>

<div class="page-body">
  <div class="group">
    <h3 class="group-title">ELENA</h3>
    <div class="gallery wide" id="galleryElena"></div>
  </div>
  <div class="group">
    <h3 class="group-title">WILL &amp; ELENA</h3>
    <div class="gallery wide" id="galleryBoth"></div>
  </div>
</div>

<footer>
  做这个网站的人：<span class="heart">Will</span> · 写给Elena
</footer>

<script src="data.js"></script>
<script>
(function(){
  function renderPhotos(boxId, arr){
    var gg = document.getElementById(boxId);
    for(var i=0;i<arr.length;i++){
      var p = document.createElement('div');
      p.className = 'photo fade';
      var im = document.createElement('img');
      im.src = arr[i];
      im.alt = '我们的照片';
      im.onerror = function(){ this.parentNode.innerHTML = '<div class="ph"><span class="dot"></span><span>照片位置</span></div>'; };
      p.appendChild(im);
      gg.appendChild(p);
    }
  }
  renderPhotos('galleryElena', photosElena);
  renderPhotos('galleryBoth', photosBoth);
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    },{threshold:.12});
    document.querySelectorAll('.fade').forEach(function(el){ io.observe(el); });
  }
})();
</script>
</body>
</html>
